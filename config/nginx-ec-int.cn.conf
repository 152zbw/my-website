# 笠偲咨询官网 Nginx 参考配置
# 证书必须同时包含 ec-int.cn 和 www.ec-int.cn 两个域名：
# certbot certonly --webroot -w /var/www/html -d ec-int.cn -d www.ec-int.cn

server {
    listen 80;
    listen [::]:80;
    server_name ec-int.cn www.ec-int.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://www.ec-int.cn$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ec-int.cn;

    ssl_certificate /etc/letsencrypt/live/ec-int.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ec-int.cn/privkey.pem;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    return 301 https://www.ec-int.cn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.ec-int.cn;

    ssl_certificate /etc/letsencrypt/live/ec-int.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ec-int.cn/privkey.pem;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        # Do not serve stale cached responses for application or private-data routes.
        proxy_cache off;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
